spring.application.name=TuyenDungThongMinh_BE
# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/db_smarthire?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Security / JWT Configuration
# ===============================
jwt.secret=q8Jf4uGz9vYpLk2rT1xWm3nB7aC8dE5fF6gH7iJ8kL9mN0oP
jwt.expiration=3600000        # 1 hour in milliseconds
jwt.refresh-expiration=604800000 # 7 days in milliseconds

# ===============================
# Email Configuration (for reset password & verification)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_email_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO